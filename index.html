<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CA Monk - Blog App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Sora', sans-serif; 
        background-color: #f8f9fb;
        background-image:
          radial-gradient(ellipse 60% 40% at 15% 0%, rgba(76, 68, 212, 0.06), transparent),
          radial-gradient(ellipse 50% 35% at 85% 10%, rgba(131, 99, 249, 0.07), transparent);
        background-attachment: fixed;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
      ::selection {
        background: rgba(76, 68, 212, 0.18);
        color: #1a1a1a;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
  </head>
  <body class="text-[#1a1a1a]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
